name: Publicar interfaz Atry Turnos
on:
  push:
    branches: [main]
    paths: ['frontend/react/**', 'scripts/react/**', 'web/**', 'cloud/**', 'scripts/build-github*.js', 'scripts/build-pages.js', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit o etiqueta a publicar; vacío utiliza la revisión seleccionada del workflow'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Compilar y verificar React cuando existe en la revisión seleccionada
        shell: bash
        run: |
          if [ -f frontend/react/package.json ]; then
            npm ci --prefix frontend/react
            npm run build
            npm run test:react
            if npm run | grep -q test:iatry-consolidation; then npm run test:iatry-consolidation; fi
          fi
      - run: node scripts/build-github.js
        env:
          CLOUD_BACKEND_VALIDATED: ${{ vars.CLOUD_BACKEND_VALIDATED }}
          CLOUD_INTEGRATION_QA: ${{ vars.CLOUD_INTEGRATION_QA }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Comprobar artefacto React y proyecto definitivo
        shell: bash
        run: |
          if [ -f scripts/react/release-check.cjs ]; then
            node scripts/react/release-check.cjs
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/github-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
