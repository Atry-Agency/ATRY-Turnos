name: Comprobación externa ATRY Turnos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/monitor-public.js
